<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Registration</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    
    <!-- MDBootstrap CSS  -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>


    <section class="hogwarts-hero min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="hero-content container py-4 my-auto">
            <div class="row d-flex justify-content-center align-items-center">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <div class="card text-gold glass-card" style="border-radius: 1rem;">
                        <div class="card-body p-5 text-center">
                            
                            <img src="img/logoH.png" alt="Hogwarts Logo" class="img-fluid mb-4 hogwarts-logo">

                            <div class="mb-md-5 mt-md-4 pb-5">

                                <h2 class="fw-bold mb-2 text-uppercase">Hogwarts Registration</h2>
                                <p class="text-danger mb-4">Ready to become a Wizard?</p>

                                <form id="signupForm">
                                <div data-mdb-input-init class="form-outline form-white mb-4 position-relative">
                                    <input type="text" id="typeUsernameX" class="form-control form-control-lg pe-5" name="username" />
                                    <label class="form-label" for="typeUsernameX">Username</label>
                                    <i class="bi bi-person-circle right-icon"></i>
                                </div>

                                <div data-mdb-input-init class="form-outline form-white mb-4 position-relative">
                                    <input type="email" id="typeEmailX" class="form-control form-control-lg pe-5" name="email" />
                                    <label class="form-label" for="typeEmailX">Email</label>
                                    <i class="bi bi-envelope right-icon"></i>
                                </div>

                                <div data-mdb-input-init class="form-outline form-white mb-4 position-relative" >
                                    <input type="password" id="typePasswordX" class="form-control form-control-lg pe-5" name="password"/>
                                    <label class="form-label" for="typePasswordX">Password</label>
                                    <i class="bi bi-lock right-icon"></i>
                                </div>

                                <div data-mdb-input-init class="form-outline form-white mb-4 position-relative">
                                    <input type="password" id="typeConfirmPasswordX" class="form-control form-control-lg pe-5" name="confirmpassword" />
                                    <label class="form-label" for="typeConfirmPasswordX">Confirm Password</label>
                                    <i class="bi bi-eye right-icon" id="togglePassword" style="cursor: pointer; pointer-events: auto;"></i>
                                </div>

                                <button data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-light btn-lg px-5 mt-4" type="submit">Register</button> </form>

                                <div class="d-flex justify-content-center text-center mt-5 pt-1">
                                    <a href="#!" class="text-white"><i class="fab fa-facebook-f fa-lg"></i></a>
                                    <a href="#!" class="text-white"><i class="fab fa-twitter fa-lg mx-4 px-2"></i></a>
                                    <a href="#!" class="text-white"><i class="fab fa-google fa-lg"></i></a>
                                </div>

                            </div>

                            <div>
                                <p class="mb-0">Already a Wizard? <a href="login.html" class="text-white-50 fw-bold">Log In</a></p>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- MDBootstrap JS -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.umd.min.js"></script>
    <script>
     $("#togglePassword").click(function() {
    
        let passwordInput = $("#typePasswordX");
        
      
        if (passwordInput.attr("type") === "password") {
            passwordInput.attr("type", "text");
     
            $(this).removeClass("bi-eye").addClass("bi-eye-slash");
        } else {
            passwordInput.attr("type", "password");
   
            $(this).removeClass("bi-eye-slash").addClass("bi-eye");
        }
    });
     $("#togglePassword").click(function() {
    
        let passwordInput = $("#typeConfirmPasswordX");
        
      
        if (passwordInput.attr("type") === "password") {
            passwordInput.attr("type", "text");
     
            $(this).removeClass("bi-eye").addClass("bi-eye-slash");
        } else {
            passwordInput.attr("type", "password");
   
            $(this).removeClass("bi-eye-slash").addClass("bi-eye");
        }
    });
    </script>

    <script>
        $(document).ready(function() {

            
            $.validator.addMethod("complexPassword", function(value, element) {
                return this.optional(element) || /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$/.test(value);
            }, "Password must contain at least one uppercase letter, one lowercase letter, and one number.");
            $.validator.addMethod("noSpace", function(value, element) { 
                return value.indexOf(" ") < 0 && value != ""; 
            }, "Spaces are not allowed.");
            
            $("#signupForm").validate({

                errorPlacement: function(error, element) {
                    error.addClass("d-block mt-1 mb-3 text-warning"); 
                    error.insertAfter(element.parent()); 
                },
                highlight: function(element) {
          
                    $(element).addClass("is-invalid").removeClass("is-valid");
                },
                unhighlight: function(element) {
                    
                    $(element).addClass("is-valid").removeClass("is-invalid");
                },

                onkeyup: function(element, event) {
                    $(element).removeClass("is-invalid");
                    $(element).parent().next(".text-warning").hide();
                },

                rules: {
                    username: {
                        required: true,
                        minlength: 3,
                        maxlength: 10,
                        noSpace:true

                    },
                    email: {
                        required: true,
                        email: true,
                        noSpace:true
                    },
                    password: {
                        required: true,
                        minlength: 8,
                        complexPassword: true,
                        noSpace:true
                    },
                    confirmpassword: { 
                        required: true,
                        equalTo: "#typePasswordX"
                    }
                }, 
                
                messages: {
                    username: {
                        required: "Please enter your username"
                        
                    },
                    email:{
                        required:"Please enter email",
                        email:"invalid email format: example@email.com"

                    },
                    password: {
                        required: "Please enter your password"
                        
                    },
                    confirmpassword:{
                        required:"enter your password again",
                        equalTo:"Password doesnt match"


                    }
                }
            }); 
        });
    </script>
</body>
</html>
